services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "${MAILPIT_MAX_MESSAGES:-500}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/livez >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mailpit-network

networks:
  mailpit-network:
    name: mailpit-network
    driver: bridge
